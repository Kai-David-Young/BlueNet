name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build BlueNet APK
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. System dependencies required by buildozer / p4a ───────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libltdl-dev \
            python3-dev

      # ── 4. Cache Gradle / Android SDK / NDK / p4a builds ────────────────
      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements_android.txt') }}
          restore-keys: pip-${{ runner.os }}-

      # ── 5. Python build tools ────────────────────────────────────────────
      # cython<3.0 is required — cython 3.x breaks most p4a recipes
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer "cython<3.0.0" virtualenv

      # ── 6. Prepare the build directory ──────────────────────────────────
      # buildozer.spec uses source.dir=. inside android/
      # Copy shared modules so they are bundled into the APK.
      - name: Stage source files for buildozer
        run: |
          # Bundle shared modules alongside main.py inside the android/ build root
          cp -r core  android/
          cp -r sites android/

      # ── 7. Build APK ─────────────────────────────────────────────────────
      - name: Build debug APK with buildozer
        working-directory: android
        env:
          ACCEPT_SDK_LICENSE: "y"
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "--- APK output directory ---"
          ls -lh bin/ 2>/dev/null || echo "(bin/ not created)"
          exit $BUILD_RC          

      # ── 8. Upload APK artifact ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bluenet-debug-${{ github.sha }}
          path: android/bin/*.apk
          retention-days: 30
          if-no-files-found: error

      # ── 9. Upload build log on failure ────────────────────────────────────
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log-${{ github.sha }}
          path: android/build.log
          retention-days: 7
